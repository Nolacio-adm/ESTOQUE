
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>CPD851 - Papel Ofício</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --bg-color: #0b0e14;
            --surface-color: rgba(20, 25, 34, 0.7);

            --text-main: #ffffff;
            --text-muted: #8b9bb4;

            --glow-cyan: #00f3ff;
            --glow-green: #00ff66;
            --glow-orange: #ff9900;
            --glow-red: #ff3366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            background-color: var(--bg-color);

            color: var(--text-main);

            display: flex;

            justify-content: center;
            align-items: stretch;

            min-height: 100vh;
            min-height: 100dvh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #1a2332 0%,
                    #0b0e14 70%
                );

            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 760px;

            min-height: 100vh;
            min-height: 100dvh;

            padding: 1.25rem 1.2rem;

            display: flex;
            flex-direction: column;

            position: relative;

            border: 1px solid rgba(0, 243, 255, 0.1);

            background: rgba(11, 14, 20, 0.95);
        }

        header {
            text-align: center;

            position: relative;

            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;

            flex-shrink: 0;
        }

        h1 {
            font-size: 1.35rem;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(0, 243, 255, 0.3);
        }

        header::after {
            content: '';

            position: absolute;

            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 55%;
            height: 2px;

            background: var(--glow-cyan);

            box-shadow:
                0 0 15px var(--glow-cyan);

            border-radius: 50%;
        }

        .sub-panel {
            background: rgba(20, 25, 34, 0.6);

            border:
                1px solid rgba(0, 243, 255, 0.1);

            border-radius: 16px;

            padding: 1rem;

            margin-bottom: 1rem;
        }

        .sub-panel h3 {
            font-size: 0.85rem;

            color: var(--glow-cyan);

            letter-spacing: 1px;

            margin-bottom: 0.8rem;

            text-transform: uppercase;
        }

        .display-stock {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 0.8rem;
        }

        .stock-input-master {
            font-size: 1.8rem;

            font-weight: bold;

            color: var(--glow-green);

            text-shadow:
                0 0 10px rgba(0,255,102,0.2);

            background: transparent;

            border: none;

            border-bottom:
                1px dashed rgba(0, 255, 102, 0.3);

            width: 80px;

            text-align: left;

            padding: 0;
        }

        .stock-input-master:focus {
            outline: none;

            border-bottom-style: solid;

            border-color: var(--glow-green);
        }

        .date-text {
            font-size: 0.7rem;

            color: var(--text-muted);
        }

        .input-group {
            display: flex;

            gap: 0.5rem;
        }

        .input-futuristic {
            flex-grow: 1;

            background: #141922;

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 8px;

            padding: 0.6rem;

            color: #fff;

            font-weight: bold;

            text-align: center;

            font-size: 0.85rem;
        }

        .input-futuristic:focus {
            outline: none;

            border-color: var(--glow-cyan);

            box-shadow:
                0 0 8px rgba(0,243,255,0.3);
        }

        .btn-action {
            background: var(--glow-cyan);

            color: #000;

            border: none;

            border-radius: 8px;

            padding: 0.6rem 1.2rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            white-space: nowrap;

            font-size: 0.8rem;

            letter-spacing: 0.5px;
        }

        .btn-action:hover {
            background: #00d2dd;

            box-shadow:
                0 0 10px rgba(0,243,255,0.4);
        }

        .printer-list {
            display: flex;

            flex-direction: column;

            gap: 0.5rem;
        }

        .printer-info {
            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 120px;
        }

        .printer-usage {
            font-size: 0.78rem;

            color: var(--glow-green);
        }

        .printer-date {
            font-size: 0.68rem;

            color: var(--text-muted);

            white-space: nowrap;
        }

        .printer-row {

            justify-content: space-between;

            align-items: center;

            background:
                rgba(255,255,255,0.03);

            padding: 0.6rem 0.8rem;

            border-radius: 8px;

            border-left:
                3px solid var(--glow-cyan);

            gap: 8px;
        }

        .printer-name {
            font-weight: bold;

            letter-spacing: 0.5px;

            font-size: 0.85rem;
        }

        .printer-controls {
            display: flex;

            align-items: center;

            gap: 0.5rem;

            flex-shrink: 0;
        }

        /*
         * CONTADOR DA IMPRESSORA
         */
        .printer-counter {
            color: var(--glow-orange);

            font-weight: bold;

            background:
                rgba(20, 25, 34, 0.8);

            border:
                1px solid rgba(255, 153, 0, 0.3);

            border-radius: 6px;

            min-width: 42px;

            text-align: center;

            padding: 0.35rem 0.5rem;

            font-size: 0.85rem;
        }

        /*
         * DATA DO ÚLTIMO DIRECIONAMENTO
         */

            font-size: 0.65rem;

            color: var(--text-muted);

            white-space: nowrap;
        }

        /*
         * BOTÃO DIRECIONAR
         */
        .btn-output {
            background: transparent;

            border:
                1px solid var(--glow-orange);

            color: var(--glow-orange);

            border-radius: 6px;

            padding: 0.35rem 0.7rem;

            font-size: 0.72rem;

            font-weight: bold;

            letter-spacing: 0.5px;

            color: #000;

            box-shadow:
                0 0 8px rgba(255,153,0,0.3);
        }

        /*
         * BOTÃO DESFAZER
         */
        .btn-undo {
            background: transparent;

            border:

            color: var(--glow-red);

            border-radius: 6px;

            padding: 0.35rem 0.6rem;

            font-size: 0.68rem;

            font-weight: bold;

            cursor: pointer;

        .toast {
            position: fixed;

            left: 50%;

            bottom:

                    1rem +
                    env(safe-area-inset-bottom)

            transform:

        .toast.show {

                font-size: 0.68rem;
            }

            .stock-input-master {
                width: 70px;

                font-size: 1.6rem;
            }
        }

        import {

        const firebaseConfig = {

            authDomain:
                "estoque-84295.firebaseapp.com",

            projectId:

            storageBucket:

            messagingSenderId:
                "704104486696",

            appId:
                "1:704104486696:web:2be634dfc63baef31c221d",

            measurementId:
                "G-D31RQ19END"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            initializeFirestore(app, {

                experimentalForceLongPolling: true,

                useFetchStreams: false

            });


        /*
         * ESTADO LOCAL
         */
        let estoqueOficio = {

            saldo: 0,

            ultimaEntrada: "-",

            direcionamentos: {}

        };


        let toastTimer;


        /*
         * ================================
         * TOAST
         * ================================
         */

        function mostrarToast(
            mensagem,
            erro = false
        ) {

            const toast =
                document.getElementById("toast");

            if (!toast) return;


            toast.textContent =
                mensagem;


            toast.classList.toggle(
                "error",
                erro
            );


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(() => {

                    toast.classList.remove(
                        "show"
                    );

                }, 2600);

        }


        /*
         * ================================
         * DATA / HORA
         * ================================
         */

        function obterDataFormatada() {

            const agora =
                new Date();


            const dia =
                String(
                    agora.getDate()
                ).padStart(2, "0");


            const mes =
                String(
                    agora.getMonth() + 1
                ).padStart(2, "0");


            const ano =
                agora.getFullYear();


            const horas =
                String(
                    agora.getHours()
                ).padStart(2, "0");


            const minutos =
                String(
                    agora.getMinutes()
                ).padStart(2, "0");


            return `${dia}/${mes}/${ano} ${horas}:${minutos}`;

        }


        /*
         * ================================
         * ATUALIZA A TELA
         * ================================
         */

        function atualizarTela() {

            /*
             * SALDO CENTRAL
             */
            document.getElementById(
                "input-oficio-saldo"
            ).value =
                estoqueOficio.saldo || 0;


            document.getElementById(
                "date-oficio-saldo"
            ).innerText =
                estoqueOficio.ultimaEntrada || "-";


            /*
             * DESTINOS
             */
            const direcionamentos =
                estoqueOficio.direcionamentos || {};


            const impressoras = [
                "NFE",
                "RME",
                "GER",
                "CPD",
                "RH"
            ];


            impressoras.forEach(
                (destino) => {

                    const chave =
                        destino.toLowerCase();


                    const dados =
                        direcionamentos[chave] || {};


                    const total =
                        Number(
                            dados.total || 0
                        );


                    const ultimaData =
                        dados.ultimaData || "-";


                    /*
                     * Contador antigo / atual
                     */
                    const contador =
                        document.getElementById(
                            `uso-oficio-${chave}`
                        );


                    if (contador) {

                        contador.innerText =
                            total;

                    }


                    /*
                     * Contador visual
                     */
                    const contadorVisual =
                        document.getElementById(
                            `contador-papel_oficio-${destino}`
                        );


                    if (contadorVisual) {

                        contadorVisual.innerText =
                            total;

                    }


                    /*
                     * Última data
                     */
                    const data =
                        document.getElementById(
                            `data-oficio-${chave}`
                        );


                    if (data) {

                        data.innerText =
                            `Último: ${ultimaData}`;

                    }


                    /*
                     * Botão DESFAZER
                     */
                    const botaoDesfazer =
                        document.getElementById(
                            `desfazer-papel_oficio-${destino}`
                        );


                    if (botaoDesfazer) {

                        botaoDesfazer.disabled =
                            total <= 0;

                    }

                }
            );

        }


        /*
         * ================================
         * FIRESTORE
         * ================================
         */

        onSnapshot(

            doc(
                db,
                "controle",
                "geral"
            ),

            (snapshot) => {

                if (!snapshot.exists()) {

                    estoqueOficio = {

                        saldo: 0,

                        ultimaEntrada: "-",

                        direcionamentos: {}

                    };


                    atualizarTela();

                    return;

                }


                const dados =
                    snapshot.data();


                if (dados.papel_oficio) {

                    estoqueOficio = {

                        saldo:
                            Number(
                                dados.papel_oficio.saldo || 0
                            ),

                        ultimaEntrada:
                            dados.papel_oficio.ultimaEntrada || "-",

                        direcionamentos:
                            dados.papel_oficio.direcionamentos || {}

                    };

                } else {

                    estoqueOficio = {

                        saldo: 0,

                        ultimaEntrada: "-",

                        direcionamentos: {}

                    };

                }


                atualizarTela();

            },


            (erro) => {

                console.error(
                    "Erro na sincronização do Firestore:",
                    erro
                );


                mostrarToast(
                    "Falha na conexão com o banco. Verifique a internet.",
                    true
                );

            }

        );


        /*
         * ================================
         * ADICIONAR ESTOQUE CENTRAL
         * ================================
         */

        window.adicionarPapelOficio =
            async function() {

                const input =
                    document.getElementById(
                        "input-oficio-add"
                    );


                const quantidade =
                    parseInt(
                        input.value,
                        10
                    );


                if (
                    !quantidade ||
                    quantidade <= 0
                ) {

                    mostrarToast(
                        "Digite uma quantidade válida.",
                        true
                    );

                    return;

                }


                const novoSaldo =
                    (
                        estoqueOficio.saldo || 0
                    ) + quantidade;


                const dataAtual =
                    obterDataFormatada();


                const novoEstoque = {

                    saldo:
                        novoSaldo,

                    ultimaEntrada:
                        dataAtual,

                    direcionamentos:
                        estoqueOficio.direcionamentos || {}

                };


                try {

                    await setDoc(

                        doc(
                            db,
                            "controle",
                            "geral"
                        ),

                        {
                            papel_oficio:
                                novoEstoque
                        },

                        {
                            merge: true
                        }

                    );


                    input.value = "";


                    mostrarToast(
                        `✓ ${quantidade} unidade(s) adicionada(s) ao estoque`
                    );


                } catch (erro) {

                    console.error(
                        "Erro ao salvar dados no Firebase:",
                        erro
                    );


                    mostrarToast(
                        `Erro ao salvar: ${erro.code || erro.message}`,
                        true
                    );

                }

            };
			
			/*
 * ================================
 * ZERAR ESTOQUE CENTRAL
 * ================================
 */

window.zerarEstoqueCentral =
    async function() {

        const saldoAtual =
            Number(
                estoqueOficio.saldo || 0
            );


        /*
         * Se já estiver zerado
         */
        if (saldoAtual <= 0) {

            mostrarToast(
                "O estoque central já está zerado.",
                true
            );

            return;

        }


        /*
         * CONFIRMAÇÃO
         */
        const confirmar =
            confirm(
                `⚠️ ATENÇÃO!\n\n` +
                `O estoque central possui ${saldoAtual} unidade(s).\n\n` +
                `Tem certeza que deseja ZERAR o estoque central?\n\n` +
                `Os direcionamentos das impressoras NÃO serão alterados.`
            );


        /*
         * Usuário cancelou
         */
        if (!confirmar) {

            mostrarToast(
                "Operação cancelada."
            );

            return;

        }


        /*
         * Zera somente o estoque central
         */
        try {

            await setDoc(

                doc(
                    db,
                    "controle",
                    "geral"
                ),

                {

                    papel_oficio: {

                        saldo: 0,

                        ultimaEntrada:
                            estoqueOficio.ultimaEntrada || "-",

                        direcionamentos:
                            estoqueOficio.direcionamentos || {}

                    }

                },

                {
                    merge: true
                }

            );


            mostrarToast(
                `✓ Estoque central zerado (${saldoAtual} unidade(s))`
            );


        } catch (erro) {

            console.error(
                "Erro ao zerar estoque central:",
                erro
            );


            mostrarToast(
                `Erro ao zerar: ${erro.code || erro.message}`,
                true
            );

        }

    };


        /*
         * ================================
         * DIRECIONAR 1 UNIDADE
         * ================================
         */

        window.direcionarUmaUnidade =
            async function(destinoNome) {


                /*
                 * Verifica saldo
                 */
                const saldoAtual =
                    Number(
                        estoqueOficio.saldo || 0
                    );


                if (saldoAtual <= 0) {

                    mostrarToast(
                        "Estoque central zerado.",
                        true
                    );

                    return;

                }


                /*
                 * Data/hora
                 */
                const dataAtual =
                    obterDataFormatada();


                /*
                 * Copia os direcionamentos atuais
                 */
                const direcionamentosAtuais =
                    {
                        ...(estoqueOficio.direcionamentos || {})
                    };


                const chaveDestino =
                    destinoNome.toLowerCase();


                /*
                 * Dados atuais da impressora
                 */
                const dadosDestino =
                    direcionamentosAtuais[
                        chaveDestino
                    ] || {

                        total: 0,

                        ultimaData: "-",

                        historico: []

                    };


                /*
                 * Histórico
                 *
                 * Mantemos as datas anteriores
                 * para que DESFAZER consiga
                 * restaurar a data correta.
                 */
                const historico =
                    Array.isArray(
                        dadosDestino.historico
                    )
                        ? [
                            ...dadosDestino.historico
                        ]
                        : [];


                /*
                 * Guarda a nova data
                 */
                historico.push(
                    dataAtual
                );


                /*
                 * Novo direcionamento
                 */
                direcionamentosAtuais[
                    chaveDestino
                ] = {

                    total:
                        Number(
                            dadosDestino.total || 0
                        ) + 1,

                    ultimaData:
                        dataAtual,

                    historico:
                        historico

                };


                /*
                 * Baixa UMA unidade
                 */
                const novoSaldo =
                    saldoAtual - 1;


                try {

                    await setDoc(

                        doc(
                            db,
                            "controle",
                            "geral"
                        ),

                        {

                            papel_oficio: {

                                saldo:
                                    novoSaldo,

                                ultimaEntrada:
                                    estoqueOficio.ultimaEntrada || "-",

                                direcionamentos:
                                    direcionamentosAtuais

                            }

                        },

                        {
                            merge: true
                        }

                    );


                    mostrarToast(
                        `✓ 1 unidade direcionada para ${destinoNome}`
                    );


                } catch (erro) {

                    console.error(
                        "Erro ao direcionar estoque:",
                        erro
                    );


                    mostrarToast(
                        `Erro ao salvar: ${erro.code || erro.message}`,
                        true
                    );

                }

            };


        /*
         * ================================
         * DESFAZER DIRECIONAMENTO
         * ================================
         */

        window.desfazerDirecionamento =
            async function(destinoNome) {


                const direcionamentosAtuais =
                    {
                        ...(estoqueOficio.direcionamentos || {})
                    };


                const chaveDestino =
                    destinoNome.toLowerCase();


                const dadosDestino =
                    direcionamentosAtuais[
                        chaveDestino
                    ];


                /*
                 * Verifica se existe
                 */
                if (!dadosDestino) {

                    mostrarToast(
                        "Nenhum direcionamento encontrado.",
                        true
                    );

                    return;

                }


                const totalAtual =
                    Number(
                        dadosDestino.total || 0
                    );


                /*
                 * Nada para desfazer
                 */
                if (totalAtual <= 0) {

                    mostrarToast(
                        "Não há direcionamento para desfazer.",
                        true
                    );

                    return;

                }


                /*
                 * Recupera histórico
                 */
                let historico =
                    Array.isArray(
                        dadosDestino.historico
                    )
                        ? [
                            ...dadosDestino.historico
                        ]
                        : [];


                /*
                 * Remove o último direcionamento
                 */
                if (historico.length > 0) {

                    historico.pop();

                }


                /*
                 * Novo total
                 */
                const novoTotal =
                    totalAtual - 1;


                /*
                 * Recupera a data anterior
                 */
                const novaUltimaData =
                    historico.length > 0
                        ? historico[
                            historico.length - 1
                        ]
                        : "-";


                /*
                 * Atualiza impressora
                 */
                direcionamentosAtuais[
                    chaveDestino
                ] = {

                    total:
                        novoTotal,

                    ultimaData:
                        novaUltimaData,

                    historico:
                        historico

                };


                /*
                 * Devolve UMA unidade
                 * para o estoque central.
                 */
                const novoSaldo =
                    Number(
                        estoqueOficio.saldo || 0
                    ) + 1;


                try {

                    await setDoc(

                        doc(
                            db,
                            "controle",
                            "geral"
                        ),

                        {

                            papel_oficio: {

                                saldo:
                                    novoSaldo,

                                ultimaEntrada:
                                    estoqueOficio.ultimaEntrada || "-",

                                direcionamentos:
                                    direcionamentosAtuais

                            }

                        },

                        {
                            merge: true
                        }

                    );


                    mostrarToast(
                        `↩ 1 unidade devolvida de ${destinoNome}`
                    );


                } catch (erro) {

                    console.error(
                        "Erro ao desfazer direcionamento:",
                        erro
                    );


                    mostrarToast(
                        `Erro ao desfazer: ${erro.code || erro.message}`,
                        true
                    );

                }

            };


        /*
         * ================================
         * ENTER NO CAMPO ADICIONAR
         * ================================
         */

        document
            .getElementById(
                "input-oficio-add"
            )
            .addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key === "Enter"
                    ) {

                        window.adicionarPapelOficio();

                    }

                }
            );

    </script>

</body>
